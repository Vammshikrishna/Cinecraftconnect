apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def reactNativeDirResolved = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
project.ext.REACT_NATIVE_NODE_MODULES_DIR = reactNativeDirResolved

react {
    root = file("../../")
    reactNativeDir = reactNativeDirResolved
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    cliFile = new File(["node", "--print", "require.resolve('react-native/cli.js')"].execute(null, rootDir).text.trim())
    entryFile = file("../../index.js")
    hermesCommand = reactNativeDirResolved.getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cinecraftconnect.app"
    defaultConfig {
        applicationId "com.cinecraftconnect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        def archs = project.findProperty('reactNativeArchitectures') ? project.property('reactNativeArchitectures').split(',') : ['arm64-v8a']
        ndk {
            abiFilters (*archs)
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    splits {
        abi {
            reset()
            enable (project.hasProperty('enableSeparateBuildPerCPUArchitecture') ? project.property('enableSeparateBuildPerCPUArchitecture').toBoolean() : true)
            universalApk true
            def architectures = project.hasProperty('reactNativeArchitectures') ? project.property('reactNativeArchitectures').split(',') : ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
            include (*architectures)
        }
    }

    packagingOptions {
        pickFirst '**/libcrypto.so'
        pickFirst '**/libjingle_peerconnection_so.so'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Never fall back to the public debug key for a release: anyone could re-sign an app with it.
            if (!project.hasProperty('RELEASE_STORE_FILE') && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                throw new GradleException('RELEASE_STORE_FILE is not set. Put the RELEASE_* signing properties in ~/.gradle/gradle.properties (do not commit them).')
            }
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Expo modules (expo-gl)
apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle")

dependencies {
    addExpoModulesDependencies(dependencies, project)
    implementation("com.facebook.react:react-android")
    implementation "androidx.exifinterface:exifinterface:1.3.6"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: "com.google.gms.google-services"
