<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B33"/>
      <stop offset="50%" stop-color="#FF6B3D"/>
      <stop offset="100%" stop-color="#FF9B54"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#fg)" stroke-width="1" opacity="0.35"/>
  <!-- Simplified aperture -->
  <g transform="translate(32, 30)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#fg)" stroke-width="2.5" opacity="0.5"/>
    <!-- Aperture blades simplified -->
    <path d="M0,-12 L7,-6 L3,-1 Z" fill="url(#fg)" opacity="0.7"/>
    <path d="M7,-6 L10,3 L4,2 Z" fill="url(#fg)" opacity="0.6"/>
    <path d="M10,3 L3,10 L1,4 Z" fill="url(#fg)" opacity="0.7"/>
    <path d="M3,10 L-7,6 L-3,1 Z" fill="url(#fg)" opacity="0.6"/>
    <path d="M-7,6 L-10,-3 L-4,-2 Z" fill="url(#fg)" opacity="0.7"/>
    <path d="M-10,-3 L-3,-10 L-1,-4 Z" fill="url(#fg)" opacity="0.6"/>
    <!-- Inner opening -->
    <polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#0a0a0a" stroke="url(#fg)" stroke-width="0.5"/>
    <!-- Play button -->
    <polygon points="-1.5,-2.5 -1.5,2.5 3,0" fill="url(#fg)"/>
    <!-- Connection dots -->
    <circle cx="0" cy="-13.5" r="1.5" fill="url(#fg)" opacity="0.9"/>
    <circle cx="11.7" cy="6.75" r="1.5" fill="url(#fg)" opacity="0.9"/>
    <circle cx="-11.7" cy="6.75" r="1.5" fill="url(#fg)" opacity="0.9"/>
    <circle cx="11.7" cy="-6.75" r="1.5" fill="url(#fg)" opacity="0.9"/>
    <circle cx="-11.7" cy="-6.75" r="1.5" fill="url(#fg)" opacity="0.9"/>
    <circle cx="0" cy="13.5" r="1.5" fill="url(#fg)" opacity="0.9"/>
  </g>
</svg>
